<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 BeCoin Autonomous Economy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f3460 100%); }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .money { font-family: 'Courier New', monospace; }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    
    <!-- Header -->
    <header class="border-b border-gray-700/50 p-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="text-4xl">💰</div>
                <div>
                    <h1 class="text-2xl font-bold">BeCoin Autonomous Economy</h1>
                    <p class="text-gray-400 text-sm">Self-managing company simulation with AI agents</p>
                </div>
            </div>
            <div class="text-right">
                <div class="text-3xl font-bold money text-green-400" id="balance">$0</div>
                <div class="text-sm text-gray-400" id="runway">0h runway</div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        
        <!-- Status Bar -->
        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="card rounded-xl p-4">
                <div class="text-gray-400 text-sm">Treasury</div>
                <div class="text-2xl font-bold money text-green-400" id="treasury-balance">$0</div>
                <div class="text-xs text-gray-500">Start: $10,000</div>
            </div>
            <div class="card rounded-xl p-4">
                <div class="text-gray-400 text-sm">Agents</div>
                <div class="text-2xl font-bold text-blue-400" id="agents-active">0/4</div>
                <div class="text-xs text-gray-500">Active workers</div>
            </div>
            <div class="card rounded-xl p-4">
                <div class="text-gray-400 text-sm">Projects</div>
                <div class="text-2xl font-bold text-purple-400" id="projects-active">0/4</div>
                <div class="text-xs text-gray-500">In progress</div>
            </div>
            <div class="card rounded-xl p-4">
                <div class="text-gray-400 text-sm">Simulation</div>
                <div class="text-2xl font-bold text-yellow-400" id="hours-elapsed">0h</div>
                <div class="text-xs text-gray-500" id="last-update">--</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid grid-cols-3 gap-6">
            
            <!-- Left: Agent Chat -->
            <div class="col-span-2 space-y-4">
                <h2 class="text-xl font-bold mb-4">🤖 Autonomous Agent Reports</h2>
                <div id="agent-reports" class="space-y-4">
                    <!-- Agents will report here -->
                </div>
            </div>

            <!-- Right: Projects & Treasury -->
            <div class="space-y-6">
                
                <!-- Projects -->
                <div class="card rounded-xl p-4">
                    <h3 class="font-bold mb-4">📋 Active Projects</h3>
                    <div id="projects-list" class="space-y-3">
                        <!-- Projects will be listed here -->
                    </div>
                </div>

                <!-- Recent Transactions -->
                <div class="card rounded-xl p-4">
                    <h3 class="font-bold mb-4">💸 Recent Transactions</h3>
                    <div id="transactions" class="space-y-2 text-sm max-h-64 overflow-y-auto">
                        <!-- Transactions will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = '.';
        
        async function loadDashboard() {
            try {
                const [treasuryRes, agentsRes, projectsRes] = await Promise.all([
                    fetch(`${API_URL}/treasury.json`),
                    fetch(`${API_URL}/agents.json`),
                    fetch(`${API_URL}/projects.json`)
                ]);
                
                const treasury = await treasuryRes.json();
                const agents = await agentsRes.json();
                const projects = await projectsRes.json();
                
                // Update header
                document.getElementById('balance').textContent = 
                    `$${treasury.balance.toLocaleString()}`;
                document.getElementById('runway').textContent = 
                    `${Math.floor(treasury.metrics.runwayHours)}h runway`;
                
                // Update status cards
                const metrics = treasury.metrics;
                document.getElementById('treasury-balance').textContent = 
                    `$${treasury.balance.toLocaleString()}`;
                
                const agentCount = Object.values(agents).filter(a => a.status === 'active').length;
                document.getElementById('agents-active').textContent = 
                    `${agentCount}/${Object.keys(agents).length}`;
                
                const projCount = Object.values(projects).filter(p => p.stage === 'active').length;
                document.getElementById('projects-active').textContent = 
                    `${projCount}/${Object.keys(projects).length}`;
                
                // Update autonomous info
                const autoData = agents.autonomous_loop || {};
                document.getElementById('hours-elapsed').textContent = 
                    `${autoData.hours_elapsed || 0}h`;
                document.getElementById('last-update').textContent = 
                    autoData.last_update ? new Date(autoData.last_update).toLocaleTimeString() : '--';
                
                // Render agent reports
                renderAgentReports(agents);
                
                // Render projects
                renderProjects(projects);
                
                // Render transactions
                renderTransactions(treasury.transactions || []);
                
            } catch (e) {
                console.error('Dashboard error:', e);
            }
        }
        
        function renderAgentReports(agents) {
            const container = document.getElementById('agent-reports');
            const agentList = Object.values(agents).filter(a => a.id);
            
            container.innerHTML = agentList.map(agent => {
                const perf = agent.performance || {};
                const statusColors = {
                    'active': 'bg-green-500',
                    'idle': 'bg-gray-500',
                    'exhausted': 'bg-red-500'
                };
                
                // Generate autonomous report
                let questions = [];
                let recommendations = [];
                
                if (agent.current_task && agent.status === 'active') {
                    questions.push(`Should I prioritize features or refactor in ${agent.current_task}?`);
                    recommendations.push(`${agent.current_task} is making good progress`);
                } else {
                    questions.push('Waiting for new tasks. Any priorities?');
                    recommendations.push('Ready for new assignments');
                }
                
                return `
                    <div class="card rounded-xl p-4">
                        <div class="flex items-start gap-4">
                            <div class="w-12 h-12 rounded-full ${statusColors[agent.status] || 'bg-gray-500'} flex items-center justify-center text-xl">
                                ${agent.role === 'frontend' ? '🎨' : 
                                  agent.role === 'backend' ? '⚙️' : 
                                  agent.role === 'ai' ? '🧠' : '🚀'}
                            </div>
                            <div class="flex-1">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-bold">${agent.name}</h3>
                                        <p class="text-sm text-gray-400">${agent.role}</p>
                                    </div>
                                    <span class="text-xs px-2 py-1 rounded ${statusColors[agent.status]}">${agent.status}</span>
                                </div>
                                
                                <div class="grid grid-cols-4 gap-4 mt-3 text-sm">
                                    <div>
                                        <div class="text-gray-500">Hours</div>
                                        <div class="font-mono">${perf.hours_worked || 0}h</div>
                                    </div>
                                    <div>
                                        <div class="text-gray-500">Tokens</div>
                                        <div class="font-mono">${(perf.tokens_consumed || 0).toLocaleString()}</div>
                                    </div>
                                    <div>
                                        <div class="text-gray-500">BeCoins</div>
                                        <div class="font-mono text-green-400">$${perf.becoin_earned?.toFixed(2) || '0.00'}</div>
                                    </div>
                                    <div>
                                        <div class="text-gray-500">Projects</div>
                                        <div class="font-mono">${perf.projects_completed || 0}</div>
                                    </div>
                                </div>
                                
                                ${agent.current_task ? `
                                    <div class="mt-3 p-2 bg-blue-900/30 rounded text-sm">
                                        <span class="text-blue-400">📌 Current:</span> ${agent.current_task}
                                    </div>
                                ` : ''}
                                
                                ${questions.length ? `
                                    <div class="mt-3 space-y-1">
                                        ${questions.map(q => `
                                            <div class="flex items-start gap-2 text-sm">
                                                <span class="text-yellow-400">❓</span>
                                                <span class="text-yellow-200">${q}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                                
                                ${recommendations.length ? `
                                    <div class="mt-2 space-y-1">
                                        ${recommendations.map(r => `
                                            <div class="flex items-start gap-2 text-sm">
                                                <span class="text-green-400">💡</span>
                                                <span class="text-green-200">${r}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderProjects(projects) {
            const container = document.getElementById('projects-list');
            const projList = Object.values(projects).filter(p => p.id);
            
            container.innerHTML = projList.map(project => {
                const stageColors = {
                    'pipeline': 'bg-gray-600',
                    'active': 'bg-blue-600',
                    'completed': 'bg-green-600',
                    'paused': 'bg-yellow-600'
                };
                
                return `
                    <div class="p-3 bg-gray-800/50 rounded-lg">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-medium">${project.name}</div>
                                <div class="text-xs text-gray-400">
                                    Cost: $${project.cost} → Value: $${project.value}
                                </div>
                            </div>
                            <span class="text-xs px-2 py-1 rounded ${stageColors[project.stage]}">${project.stage}</span>
                        </div>
                        <div class="mt-2">
                            <div class="flex justify-between text-xs text-gray-400 mb-1">
                                <span>Progress</span>
                                <span>${project.progress?.toFixed(0) || 0}%</span>
                            </div>
                            <div class="h-2 bg-gray-700 rounded-full overflow-hidden">
                                <div class="h-full bg-blue-500 transition-all" style="width: ${project.progress || 0}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function renderTransactions(transactions) {
            const container = document.getElementById('transactions');
            
            if (!transactions || transactions.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">No transactions yet</p>';
                return;
            }
            
            const recent = transactions.slice(-10).reverse();
            
            container.innerHTML = recent.map(tx => {
                const isIncome = tx.amount > 0;
                const typeIcons = {
                    'PROJECT_REVENUE': '💰',
                    'AGENT_SALARY': '👤',
                    'AGENT_BONUS': '🎁',
                    'OPERATIONS_COST': '🏢',
                    'TAX_DEDUCTION': '🏛️',
                    'TOKEN_COST': '🧠'
                };
                
                return `
                    <div class="flex items-center gap-2 p-2 rounded hover:bg-gray-700/30">
                        <span class="text-lg">${typeIcons[tx.type] || '💸'}</span>
                        <div class="flex-1">
                            <div class="text-xs text-gray-400">${tx.description?.slice(0, 30)}...</div>
                            <div class="text-xs text-gray-500">${new Date(tx.timestamp).toLocaleTimeString()}</div>
                        </div>
                        <div class="font-mono ${isIncome ? 'text-green-400' : 'text-red-400'}">
                            ${isIncome ? '+' : ''}$${Math.abs(tx.amount).toFixed(0)}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Auto-refresh every 5 seconds
        loadDashboard();
        setInterval(loadDashboard, 5000);
    </script>
</body>
</html>
