# CI Workflow for BeCoin EcoSim
# Runs linting (Black, flake8) and tests (pytest) on PRs and pushes to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('dashboard/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f dashboard/requirements.txt ]; then
            pip install -r dashboard/requirements.txt
          fi
          pip install black flake8

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with flake8
        run: flake8 .

      - name: Run tests with pytest
        run: pytest -q becoin_economy
