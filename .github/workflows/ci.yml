name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install dashboard requirements if available, otherwise install minimal deps
        if [ -f dashboard/requirements.txt ]; then
          pip install -r dashboard/requirements.txt
        fi
        # Ensure linting tools are installed
        pip install black flake8 pytest

    - name: Run Black (check only)
      run: |
        black --check .

    - name: Run flake8
      run: |
        flake8 .

    - name: Run pytest
      run: |
        pytest -q becoin_economy
